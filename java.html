<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8" name="robots" content="noindex">
  <title>Java</title>
</head>
<body>
  <pre id="javabasics">Java Basics</pre>
  <pre id="java8">Java 8</pre>
  <pre id="javacollections">Java Collections</pre>
  <pre id="javaiqs">Java IQs</pre>
  <pre id="javacoding">Java coding</pre>
  <pre id="multithreading">MultiThreading</pre>
  <script>
    fetch("Java.txt")
      .then(response => response.text())
      .then(text => {
        document.getElementById("javabasics").textContent = text;
      })
      .catch(err => {
        document.getElementById("javabasics").textContent = "Could not load file Java.txt.";
      });
    fetch("Java8.txt")
      .then(response => response.text())
      .then(text => {
        document.getElementById("java8").textContent = text;
      })
      .catch(err => {
        document.getElementById("java8").textContent = "Could not load file Java8.txt.";
      });
    fetch("JavaCollections.txt")
      .then(response => response.text())
      .then(text => {
        document.getElementById("javacollections").textContent = text;
      })
      .catch(err => {
        document.getElementById("javacollections").textContent = "Could not load file Javacollections.txt.";
      });
    fetch("Java-IQs.txt")
      .then(response => response.text())
      .then(text => {
        document.getElementById("javaiqs").textContent = text;
      })
      .catch(err => {
        document.getElementById("javaiqs").textContent = "Could not load file Java-IQs.txt.";
      });
   

     fetch("MultiThreading.txt")
      .then(response => response.text())
      .then(text => {
        document.getElementById("multithreading").textContent = text;
      })
      .catch(err => {
        document.getElementById("multithreading").textContent = "Could not load file MultiThreading.txt.";
      });

    fetch("java8_coding.txt")
      .then(response => response.text())
      .then(text => {
        document.getElementById("javacoding").textContent = text;
      })
      .catch(err => {
        document.getElementById("javacoding").textContent = "Could not load file java8_coding.txt.";
      });
    
  </script>
</body>
</html>
